# uno.rosemont.place — currently the front door for the whole platform while it's
# the only pointed subdomain. Routes on ONE origin (so the session cookie is shared
# and SSO is automatic):
#   /        -> hub    (:5060)   catalog, central auth (/auth/*), social, notify WS
#   /uno/    -> uno    (:5050)   the UNO game (client is base-path aware)
#   /holdem/ -> holdem (:5070)   Texas Hold'em
#   /ginrummy/ -> ginrummy (:5080) Gin Rummy
#
# Drop-in replacement for /etc/nginx/sites-available/uno.rosemont.place (keeps the
# existing certbot-managed TLS block). After copying:  sudo nginx -t && sudo systemctl reload nginx
#
# When gamehub.rosemont.place is pointed, move the hub to its own server block and
# make /uno/ its own uno.rosemont.place root — the app code already supports both.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name uno.rosemont.place;

    # UNO game under /uno/ (trailing-slash proxy_pass strips the prefix).
    location /uno/ {
        proxy_pass http://127.0.0.1:5050/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /uno { return 301 /uno/; }

    # Texas Hold'em under /holdem/.
    location /holdem/ {
        proxy_pass http://127.0.0.1:5070/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /holdem { return 301 /holdem/; }

    # Gin Rummy under /ginrummy/.
    location /ginrummy/ {
        proxy_pass http://127.0.0.1:5080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /ginrummy { return 301 /ginrummy/; }

    # Everything else -> the hub (catalog, /auth/*, /api/friends, notify WS at /).
    location / {
        proxy_pass http://127.0.0.1:5060;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/uno.rosemont.place/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uno.rosemont.place/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = uno.rosemont.place) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name uno.rosemont.place;
    return 404;
}
