# Rosemont Games — platform subdomains (games / play / api / join).
#
# Front-door split on *.rosemont.place, all on one instance so the session
# cookie (Domain=.rosemont.place) is shared → SSO across every subdomain:
#
#   games.rosemont.place  canonical home + catalog + /auth/* + /api/* + notify WS
#   play.rosemont.place   the game surfaces (/uno/, /holdem/, /ginrummy/) — same full routing
#   api.rosemont.place    backend entry (same origin app; /auth, /api, WS)
#   join.rosemont.place   stateless invite short-links → redirect into a room
#
# The `map $http_upgrade $connection_upgrade` used below is already defined in
# the uno.rosemont.place server block (maps are http-global) — do NOT redefine.
#
# Deploy:  sudo cp nginx/rosemont-platform.conf /etc/nginx/sites-available/rosemont-platform
#          sudo ln -sf /etc/nginx/sites-available/rosemont-platform /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d games.rosemont.place -d play.rosemont.place \
#                               -d api.rosemont.place  -d join.rosemont.place \
#                               --non-interactive --agree-tos --redirect -m william.h.wagg@gmail.com
# certbot injects the `listen 443 ssl` + cert paths + 80→443 redirect in place.

# ── App-serving hosts: games, play, api ──────────────────────────────────────
server {
    listen 80;
    server_name games.rosemont.place play.rosemont.place api.rosemont.place;

    # UNO under /uno/ (trailing-slash proxy_pass strips the prefix).
    location /uno/ {
        proxy_pass http://127.0.0.1:5050/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /uno { return 301 /uno/; }

    # Texas Hold'em under /holdem/.
    location /holdem/ {
        proxy_pass http://127.0.0.1:5070/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /holdem { return 301 /holdem/; }

    # Gin Rummy under /ginrummy/.
    location /ginrummy/ {
        proxy_pass http://127.0.0.1:5080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /ginrummy { return 301 /ginrummy/; }

    # Everything else → hub (catalog, /auth/*, /api/*, /hidden/*, notify WS at /).
    location / {
        proxy_pass http://127.0.0.1:5060;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ── Invite short-links: join.rosemont.place ──────────────────────────────────
# Stateless: join.rosemont.place/uno/CODE → games.rosemont.place/uno/?room=CODE.
# No app state needed — the game client reads ?room= and joins.
server {
    listen 80;
    server_name join.rosemont.place;

    location ~ "^/(uno|holdem|ginrummy)/([A-Za-z0-9]{3,10})/?$" {
        return 302 https://games.rosemont.place/$1/?room=$2;
    }
    # Anything else on join. → the home page.
    location / { return 302 https://games.rosemont.place/; }
}
