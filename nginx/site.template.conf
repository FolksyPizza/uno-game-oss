# Rosemont Games — nginx server block template (pre-TLS).
#
# Rendered by provision-subdomain.sh with __SERVER_NAME__ and __UPSTREAM_PORT__
# substituted, then `certbot --nginx -d <server_name>` upgrades this HTTP block
# in place: it injects the `listen 443 ssl` server, the Let's Encrypt cert paths,
# and the 80->443 redirect (exactly how uno.rosemont.place was created).
#
# proxy settings carry the WebSocket upgrade headers so wss:// works for both the
# global notification socket (ws.rosemont.place) and per-game gameplay sockets.

server {
    listen 80;
    server_name __SERVER_NAME__;

    location / {
        proxy_pass http://127.0.0.1:__UPSTREAM_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket connections (gameplay + notifications) can idle between frames.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
