# Rosemont Games — one Postgres, the hub, and each game as its own service.
#
# All app services build from the REPO ROOT context (so they can bundle core/) and
# bind to 127.0.0.1 only; nginx terminates TLS on uno.rosemont.place and routes:
#   /        -> hub    (127.0.0.1:5060)   catalog + central auth + social + notify WS
#   /uno/    -> uno    (127.0.0.1:5050)
#   /holdem/ -> holdem (127.0.0.1:5070)
#   /ginrummy/ -> ginrummy (127.0.0.1:5080)
# Same origin ⇒ one shared session cookie ⇒ SSO with zero cookie-domain config, and
# OAuth stays at uno.rosemont.place (matches the existing Google console redirect).

services:
  hub:
    build:
      context: .
      dockerfile: hub/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5060:5060"
    networks: [db]
    environment:
      - PORT=5060
      - SERVICE_NAME=hub
      - DATABASE_URL=postgres://uno:uno@db:5432/uno
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:5060}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - JOIN_URL=${JOIN_URL:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5060"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  uno:
    build:
      context: .
      dockerfile: games/uno/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5050:5050"
    networks: [db]
    environment:
      - PORT=5050
      - SERVICE_NAME=uno
      - DATABASE_URL=postgres://uno:uno@db:5432/uno
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:5050}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - JOIN_URL=${JOIN_URL:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5050"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  holdem:
    build:
      context: .
      dockerfile: games/holdem/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5070:5070"
    networks: [db]
    environment:
      - PORT=5070
      - SERVICE_NAME=holdem
      - DATABASE_URL=postgres://uno:uno@db:5432/uno
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:5070}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - JOIN_URL=${JOIN_URL:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5070"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  ginrummy:
    build:
      context: .
      dockerfile: games/ginrummy/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5080:5080"
    networks: [db]
    environment:
      - PORT=5080
      - SERVICE_NAME=ginrummy
      - DATABASE_URL=postgres://uno:uno@db:5432/uno
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:5080}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - JOIN_URL=${JOIN_URL:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5080/api/online"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  blackjack:
    build:
      context: .
      dockerfile: games/blackjack/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5090:5090"
    networks: [db]
    environment:
      - PORT=5090
      - SERVICE_NAME=blackjack
      - DATABASE_URL=postgres://uno:uno@db:5432/uno
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:5090}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - JOIN_URL=${JOIN_URL:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5090/api/online"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=uno
      - POSTGRES_PASSWORD=uno
      - POSTGRES_DB=uno
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uno -d uno"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  db:
volumes:
  db-data:
